<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlist — Time-Series DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="liquid-glass-card">
        <div class="liquid-brand">
            <div class="liquid-brand-icon">⚡</div>
            <div class="liquid-brand-name">TIMESERIES // HUD</div>
            <span class="brand-tag">OFFSHORE TELEMETRY GATEWAY</span>
        </div>

        <h1>Operator Registration</h1>

        <div id="errorMsg" class="glass-error-msg"></div>

        <form onsubmit="handleSignup(event)">
            <div class="auth-form-group">
                <label for="email">Callsign / Operator Email*</label>
                <input type="email" id="email" placeholder="operator@telemetry.io" required autocomplete="email">
            </div>
            <div class="auth-form-group">
                <label for="password">Create Security Key (Min 6 chars)*</label>
                <input type="password" id="password" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>
            <div class="auth-form-group">
                <label for="confirmPassword">Confirm Security Key*</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-liquid-submit" id="submitBtn">Enlist & Access HUD →</button>
        </form>

        <div class="liquid-footer">
            Existing operator? <a href="index.html">Initialize Session (Log In)</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            errBox.textContent = 'Security keys do not match.';
            errBox.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Provisioning Clearance...';
        errBox.style.display = 'none';

        try {
            await signupWithEmail(
                document.getElementById('email').value.trim(),
                password
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Registration failed.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Enlist & Access HUD →';
        }
    }
</script>
</body>
</html>
