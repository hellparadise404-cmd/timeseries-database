<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Time-Series DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
    <!-- Decorative circles -->
    <div class="circle" style="width:200px;height:200px;top:-50px;right:-40px"></div>
    <div class="circle" style="width:300px;height:300px;bottom:-100px;left:-80px"></div>
    <div class="circle" style="width:80px;height:80px;top:18%;left:8%"></div>
    <div class="circle" style="width:60px;height:60px;top:55%;right:10%"></div>
    <div class="circle" style="width:140px;height:140px;bottom:12%;right:6%"></div>
    <div class="circle" style="width:100px;height:100px;top:8%;right:28%"></div>
    <div class="circle" style="width:50px;height:50px;bottom:35%;left:18%"></div>
    <div class="circle" style="width:40px;height:40px;top:40%;left:30%"></div>

    <div class="auth-card">
        <div class="brand">
            <div class="brand-icon">📈</div>
            <div class="brand-name">Time-Series DB</div>
        </div>

        <h1>Create Account</h1>

        <button class="google-btn" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Sign up with Google
        </button>

        <div class="divider">OR</div>

        <div id="errorMsg" class="error-msg"></div>

        <form onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="index.html">Log In</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        // Check passwords match
        if (password !== confirm) {
            errBox.textContent = 'Passwords do not match.';
            errBox.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        errBox.style.display = 'none';

        try {
            await signupWithEmail(
                document.getElementById('email').value,
                password
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message;
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }
</script>
</body>
</html>
