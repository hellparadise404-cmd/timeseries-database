<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Time-Series Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <span class="category-tag">Time-Series Platform</span>
            <h1>Create Account</h1>
        </div>

        <div id="errorMsg" class="error-banner"></div>

        <form onsubmit="handleSignup(event)">
            <div class="auth-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
            </div>
            <div class="auth-group">
                <label for="password">Password (Minimum 6 characters)</label>
                <input type="password" id="password" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>
            <div class="auth-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" minlength="6" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-auth-submit" id="submitBtn">Create Account</button>
        </form>

        <div class="auth-footer">
            Already registered? <a href="index.html">Sign In</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            errBox.textContent = 'Passwords do not match.';
            errBox.style.display = 'block';
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        errBox.style.display = 'none';

        try {
            await signupWithEmail(
                document.getElementById('email').value.trim(),
                password
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Registration failed.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }
</script>
</body>
</html>
