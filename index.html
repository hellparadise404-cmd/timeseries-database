<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — TimeSeries DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>TimeSeries DB</h1>
            <p>Enter your credentials to access the viewer</p>
        </div>

        <div id="errorMsg" class="validation-box error hidden"></div>

        <form class="auth-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        errBox.classList.add('hidden');

        try {
            await loginWithEmail(
                document.getElementById('email').value.trim(),
                document.getElementById('password').value
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Authentication failed. Please verify credentials.';
            errBox.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
</body>
</html>
