<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Access — Time-Series DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="liquid-glass-card">
        <div class="liquid-brand">
            <div class="liquid-brand-icon">⚡</div>
            <div class="liquid-brand-name">TIMESERIES // HUD</div>
            <span class="brand-tag">OFFSHORE TELEMETRY GATEWAY</span>
        </div>

        <h1>Pilot Authentication</h1>

        <div id="errorMsg" class="glass-error-msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="auth-form-group">
                <label for="email">Callsign / Operator Email*</label>
                <input type="email" id="email" placeholder="operator@telemetry.io" required autocomplete="email">
            </div>
            <div class="auth-form-group">
                <label for="password">Security Key / Password*</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-liquid-submit" id="submitBtn">Initialize Session →</button>
        </form>

        <div class="liquid-footer">
            Unregistered operator? <a href="signup.html">Request Clearance (Sign Up)</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'Verifying Clearance...';
        errBox.style.display = 'none';

        try {
            await loginWithEmail(
                document.getElementById('email').value.trim(),
                document.getElementById('password').value
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Authentication failed. Please verify credentials.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Initialize Session →';
        }
    }
</script>
</body>
</html>
