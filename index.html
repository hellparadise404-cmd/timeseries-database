<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Time-Series DB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="brand">
            <svg width="34" height="34" viewBox="0 0 64 64" fill="none">
                <polygon points="32,6 56,20 56,44 32,58 8,44 8,20" stroke="#1e2552" stroke-width="5" fill="#2d3775"/>
                <polygon points="32,18 44,25 44,39 32,46 20,39 20,25" fill="#4f8cff"/>
                <circle cx="32" cy="32" r="4" fill="#ffffff"/>
            </svg>
            <div class="brand-name">timeseriesdb</div>
        </div>

        <h1>Log In</h1>

        <button type="button" class="google-btn" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Log in with Google
        </button>

        <div class="divider">OR</div>

        <div id="errorMsg" class="error-msg"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email address*</label>
                <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password*</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Continue</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        errBox.style.display = 'none';

        try {
            await loginWithEmail(
                document.getElementById('email').value.trim(),
                document.getElementById('password').value
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Login failed. Please check your credentials.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Continue';
        }
    }
</script>
</body>
</html>
