<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Time-Series Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-header">
            <span class="category-tag">Time-Series Platform</span>
            <h1>Sign In</h1>
        </div>

        <div id="errorMsg" class="error-banner"></div>

        <form onsubmit="handleLogin(event)">
            <div class="auth-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
            </div>
            <div class="auth-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth-submit" id="submitBtn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Create an Account</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    redirectIfLoggedIn();

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const errBox = document.getElementById('errorMsg');
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        errBox.style.display = 'none';

        try {
            await loginWithEmail(
                document.getElementById('email').value.trim(),
                document.getElementById('password').value
            );
            window.location.href = 'dashboard.html';
        } catch (err) {
            errBox.textContent = err.message || 'Authentication failed. Please verify credentials.';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }
</script>
</body>
</html>
